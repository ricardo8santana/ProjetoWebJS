<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de contato</title>
    <link rel="stylesheet" href="css/form_contato.css">
</head>
<body>
    <form id="form-contato">
        <h2>Fale conosco</h2>
        <div class="input-group">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required maxlength="50">
        </div>

         <div class="input-group">
            <label for="email"><E-mail>E-mail</E-mail></label>
            <input type="email" id="email" name="email" required maxlength="50" autocomplete="off">
        </div>

         <div class="input-group">
            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" required maxlength="200"></textarea>
        </div>

        <button type="submit">Enviar</button>

    </form>
    <script src="js/form_contato.js"></script>
</body>
</html>
